<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <title>SEOSONA Thumbnail 9:16</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1080px;
            height: 1920px;
            background-color: {{COLOR_NAVY}};
            background-image: radial-gradient(rgba(255,255,255,0.12) 1.8px, transparent 1.8px);
            background-size: 32px 32px;
            color: white;
            font-family: 'Be Vietnam Pro', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* ── Watermark (Right-edge, cropped, large) ── */
        .watermark {
            position: absolute;
            top: 25%;
            right: -60px;
            font-size: 320px;
            font-weight: 900;
            color: rgba(255,255,255,0.05);
            line-height: 0.9;
            z-index: 1;
            pointer-events: none;
            writing-mode: vertical-lr;
            text-orientation: mixed;
            letter-spacing: 20px;
        }

        /* ── Floating Tech Icons ── */
        .float-icon {
            position: absolute;
            z-index: 5;
            opacity: 0.45;
        }
        /* Left side icons */
        .fi-chart {
            left: 30px; top: 42%;
            width: 180px; height: 180px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 20px;
        }
        .fi-flowchart {
            left: 50px; top: 62%;
            width: 140px; height: 140px;
        }
        /* Right side icons */
        .fi-ai-chip {
            right: 40px; top: 48%;
            width: 160px; height: 160px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 18px;
        }
        .fi-checklist {
            right: 60px; top: 66%;
            width: 120px; height: 120px;
        }
        .fi-browser {
            left: 20px; top: 55%;
            width: 160px; height: 100px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 12px;
        }

        /* ── Content Layers ── */
        .layer-top {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 60px 0;
        }

        .logo-pill {
            background: white;
            padding: 14px 36px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            margin-bottom: 8px;
        }
        .logo-pill img {
            height: 48px;
            object-fit: contain;
        }
        .logo-tagline {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }

        .top-label {
            background-color: {{COLOR_BLUE}};
            color: white;
            font-weight: 800;
            font-size: 34px;
            padding: 14px 42px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.25);
            margin-bottom: 24px;
        }

        .main-title {
            font-weight: 900;
            font-size: 105px;
            line-height: 1.08;
            letter-spacing: -3px;
            text-transform: uppercase;
            text-shadow: 0 16px 40px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 960px;
            z-index: 12;
        }
        .main-title.center-full {
            font-size: 130px;
            margin-top: 60px;
        }
        .title-keyword {
            color: {{COLOR_LIGHT_BLUE}};
            border-bottom: 10px solid {{COLOR_LIGHT_BLUE}};
            padding-bottom: 2px;
            display: inline;
        }

        /* ── Portrait Layer (overlaps title) ── */
        .layer-portrait {
            position: absolute;
            bottom: 280px;
            left: 50%;
            transform: translateX(-50%);
            width: 1200px;
            height: 900px;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .layer-portrait img {
            max-width: 110%;
            max-height: 110%;
            object-fit: contain;
            filter: drop-shadow(0 0 80px rgba(187,222,251,0.35));
        }

        /* ── Middle Content Card (for flowchart/mockup layout) ── */
        .layer-middle-card {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            z-index: 15;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25);
        }

        /* ── Bottom Layer ── */
        .layer-bottom {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 55px 50px;
        }

        .subtext-italic {
            font-size: 30px;
            font-weight: 400;
            font-style: italic;
            color: rgba(255,255,255,0.7);
            text-align: center;
            margin-bottom: 28px;
            max-width: 900px;
            line-height: 1.4;
        }

        .cta-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: {{COLOR_NAVY}};
            border: 3px solid {{COLOR_BLUE}};
            border-radius: 9999px;
            padding: 16px 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            max-width: 980px;
        }
        .cta-pill .cta-text {
            font-size: 46px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1;
            text-shadow: 0 8px 20px rgba(0,0,0,0.4);
            white-space: nowrap;
        }
        .cta-highlight {
            color: {{COLOR_YELLOW}};
        }
        .cta-arrows {
            font-size: 50px;
            font-weight: 900;
            color: {{COLOR_YELLOW}};
            margin-left: 8px;
        }

        .footer {
            width: 100%;
            border-top: 2px solid rgba(255,255,255,0.15);
            padding-top: 24px;
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <!-- Watermark (Right edge, cropped) -->
    <div class="watermark">{{WATERMARK}}</div>

    <!-- Floating Tech Icons (Left) -->
    <div class="float-icon fi-chart">
        <svg viewBox="0 0 140 140" fill="none" stroke="{{COLOR_BLUE}}" stroke-width="2.5">
            <rect x="10" y="80" width="25" height="50" rx="4" fill="rgba(255,255,255,0.08)"/>
            <rect x="45" y="50" width="25" height="80" rx="4" fill="rgba(255,255,255,0.08)"/>
            <rect x="80" y="30" width="25" height="100" rx="4" fill="rgba(255,255,255,0.08)"/>
            <polyline points="22,75 57,45 92,25" stroke="{{COLOR_LIGHT_BLUE}}" stroke-width="2" fill="none"/>
            <circle cx="22" cy="75" r="4" fill="{{COLOR_LIGHT_BLUE}}"/>
            <circle cx="57" cy="45" r="4" fill="{{COLOR_LIGHT_BLUE}}"/>
            <circle cx="92" cy="25" r="4" fill="{{COLOR_LIGHT_BLUE}}"/>
        </svg>
    </div>
    <div class="float-icon fi-flowchart">
        <svg viewBox="0 0 140 140" fill="none" stroke="{{COLOR_BLUE}}" stroke-width="2">
            <rect x="30" y="10" width="80" height="35" rx="8" fill="rgba(255,255,255,0.06)"/>
            <line x1="70" y1="45" x2="70" y2="65"/>
            <line x1="70" y1="65" x2="30" y2="65"/>
            <line x1="70" y1="65" x2="110" y2="65"/>
            <rect x="5" y="75" width="50" height="30" rx="6" fill="rgba(255,255,255,0.06)"/>
            <rect x="85" y="75" width="50" height="30" rx="6" fill="rgba(255,255,255,0.06)"/>
            <line x1="30" y1="65" x2="30" y2="75"/>
            <line x1="110" y1="65" x2="110" y2="75"/>
        </svg>
    </div>

    <!-- Floating Tech Icons (Right) -->
    <div class="float-icon fi-ai-chip">
        <svg viewBox="0 0 124 124" fill="none" stroke="{{COLOR_BLUE}}" stroke-width="2">
            <rect x="30" y="30" width="64" height="64" rx="14" fill="rgba(255,255,255,0.06)"/>
            <circle cx="62" cy="62" r="16" stroke="{{COLOR_LIGHT_BLUE}}"/>
            <circle cx="62" cy="62" r="6" fill="{{COLOR_LIGHT_BLUE}}" stroke="none"/>
            <!-- Pins -->
            <line x1="62" y1="10" x2="62" y2="30"/>
            <line x1="62" y1="94" x2="62" y2="114"/>
            <line x1="10" y1="62" x2="30" y2="62"/>
            <line x1="94" y1="62" x2="114" y2="62"/>
            <line x1="42" y1="10" x2="42" y2="30"/>
            <line x1="82" y1="10" x2="82" y2="30"/>
            <line x1="42" y1="94" x2="42" y2="114"/>
            <line x1="82" y1="94" x2="82" y2="114"/>
            <text x="62" y="66" font-family="sans-serif" font-size="16" fill="{{COLOR_LIGHT_BLUE}}" text-anchor="middle" stroke="none" font-weight="700">AI</text>
        </svg>
    </div>
    <div class="float-icon fi-checklist">
        <svg viewBox="0 0 120 120" fill="none" stroke="{{COLOR_BLUE}}" stroke-width="2">
            <rect x="10" y="10" width="100" height="100" rx="16" fill="rgba(255,255,255,0.06)"/>
            <polyline points="30,50 42,62 58,42" stroke="{{COLOR_LIGHT_BLUE}}" stroke-width="3"/>
            <line x1="68" y1="50" x2="90" y2="50" stroke-width="2.5"/>
            <polyline points="30,78 42,90 58,70" stroke="{{COLOR_LIGHT_BLUE}}" stroke-width="3"/>
            <line x1="68" y1="78" x2="90" y2="78" stroke-width="2.5"/>
            <line x1="30" y1="30" x2="90" y2="30" stroke-width="2.5"/>
        </svg>
    </div>

    <!-- TOP: Logo + Label + Title -->
    <div class="layer-top">
        <div class="logo-pill">
            <img src="{{LOGO_PATH}}" alt="Logo">
        </div>
        <div class="logo-tagline">{{BRAND_TAGLINE}}</div>
        <div class="top-label">{{TOP_LABEL}}</div>
        <h1 class="main-title {{TITLE_CLASS}}">
            {{MAIN_TITLE_1}} <span class="title-keyword">{{MAIN_TITLE_KW}}</span><br>{{MAIN_TITLE_2}}
        </h1>
    </div>

    <!-- MIDDLE: Portrait (overlaps title) -->
    <div class="layer-portrait" style="{{PORTRAIT_STYLE}}">
        <img src="{{PORTRAIT_PATH}}" alt="Character">
    </div>

    <!-- MIDDLE: Content Card (flowchart/mockup, hidden by default) -->
    <div class="layer-middle-card" style="{{CARD_STYLE}}">
        {{CARD_CONTENT}}
    </div>

    <!-- BOTTOM: Subtext + CTA + Footer -->
    <div class="layer-bottom">
        <p class="subtext-italic" style="{{SUBTEXT_STYLE}}">{{SUBTEXT_ITALIC}}</p>
        <div class="cta-pill">
            <span class="cta-text">
                {{CTA_1}} <span class="cta-highlight">{{CTA_KW}}</span> {{CTA_2}}
            </span>
            <span class="cta-arrows">»</span>
        </div>
        <div class="footer">
            {{BRAND_NAME}} · {{BRAND_TAGLINE_UPPER}}
        </div>
    </div>
</body>
</html>
