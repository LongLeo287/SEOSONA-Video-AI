name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Best-effort: install project deps if declared (tests that need heavy/native deps
          # are expected to skip themselves when the dep is unavailable).
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Compile check (py_compile gate)
        run: |
          python - <<'PY'
          import compileall, sys
          ok = compileall.compile_dir('.', quiet=1, maxlevels=20,
                                      rx=__import__('re').compile(r'(node_modules|__pycache__|\.git)'))
          sys.exit(0 if ok else 1)
          PY

      - name: Unit tests
        run: pytest tests/ -q
