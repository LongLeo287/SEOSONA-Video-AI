<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Youtube Thumbnail 16:9</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');
        
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: #FFFFFF; font-family: 'Montserrat', sans-serif; position: relative; overflow: hidden; }

        .bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.9) opacity(0.5); }
        .bg-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, #F4F7FF 0%, rgba(255,255,255,0.1) 100%); }

        .content { position: absolute; top: 15%; left: 10%; width: 60%; }

        .badge { background: #fee2e2; color: #dc2626; padding: 15px 40px; font-size: 40px; font-weight: 900; border-radius: 20px; display: inline-block; margin-bottom: 40px; text-transform: uppercase; border: 4px solid #dc2626; box-shadow: 10px 10px 0 #dc2626;}

        .title { font-size: 140px; font-weight: 900; color: #0F172A; line-height: 1.1; text-transform: uppercase; text-shadow: 4px 4px 0 #ffffff; }
        .title .highlight { color: #dc2626; /* Đỏ rực trên nền sáng */ }

        .right-subject { position: absolute; right: 5%; bottom: 0; height: 95%; filter: drop-shadow(-20px 0 30px rgba(0,0,0,0.8)); }
    </style>
</head>
<body>
    <img class="bg-img" src="../../5_ASSETS/tham_khao/726548941_122182326200800562_1913999368989960505_n.jpg">
    <div class="bg-gradient"></div>

    <div class="content">
        <div class="badge">BÍ MẬT SEO</div>
        <div class="title">BÍ QUYẾT LÊN <br><span class="highlight">TOP 1</span></div>
    </div>

    <!-- Cắt ảnh nhân vật/mascot lồng vào đây -->
    <img class="right-subject" src="../../5_ASSETS/logos/Chi Quyet Academy Mascot Logo.png">
</body>
</html>
