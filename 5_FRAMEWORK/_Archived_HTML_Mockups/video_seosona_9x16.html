<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Video Template 9:16 (SEOSONA Shorts)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
        
        body { margin: 0; padding: 0; width: 1080px; height: 1920px; background-color: #F4F7FF; font-family: 'Montserrat', sans-serif; overflow: hidden; position: relative; }

        .bg-blur { position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; background-image: url('../../5_ASSETS/tham_khao/726145706_984738004369081_5662943572363626530_n.jpg'); background-size: cover; filter: blur(60px) opacity(0.3); z-index: 1; }

        .safe-zone-content {
            position: absolute; top: 15%; bottom: 25%; left: 5%; right: 15%; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .glass-card {
            width: 100%; max-height: 50%;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(249, 115, 22, 0.5); /* Viền cam mờ */
            border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 60px;
        }
        .glass-card img { width: 100%; height: auto; object-fit: contain; }

        .kinetic-subtitle {
            width: 100%; text-align: center; font-size: 90px; font-weight: 900; line-height: 1.1; text-transform: uppercase; color: #0F172A;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff;
        }
        .word { display: inline-block; opacity: 0.3; transition: 0.1s; }
        .word.active { opacity: 1; color: #f97316; transform: scale(1.15) rotate(-2deg); }

        .brand-tag {
            position: absolute; top: 5%; left: 5%;
            background: #f97316; color: white; padding: 15px 40px; border-radius: 50px; font-weight: 900; font-size: 36px; z-index: 10;
        }
    </style>
</head>
<body>
    <div class="bg-blur"></div>
    <div class="brand-tag">SEOSONA NEWS</div>
    <div class="safe-zone-content">
        <div class="glass-card">
            <img src="../../5_ASSETS/tham_khao/724535166_984742267701988_5507095357270299590_n.jpg">
        </div>
        <div class="kinetic-subtitle">
            <span class="word">MỘT</span> <span class="word">TÍNH</span> <span class="word">NĂNG</span> <span class="word active">MỚI</span>
        </div>
    </div>
</body>
</html>
