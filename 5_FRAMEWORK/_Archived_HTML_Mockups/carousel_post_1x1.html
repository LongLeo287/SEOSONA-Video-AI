<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Carousel Post 1:1 (Chí Quyết Academy)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        :root {
            --red-cq: #dc2626;
            --blue-ai: #2563eb;
            --bg-color: #f8fafc;
        }

        body {
            margin: 0; padding: 0;
            width: 1080px; height: 1080px;
            background: linear-gradient(135deg, #ffffff 0%, #eff6ff 100%);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            color: #0f172a;
        }

        /* Abstract Blue Blobs from Reference */
        .blob-1 { position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: rgba(37, 99, 235, 0.05); border-radius: 50%; border: 1px solid rgba(37,99,235,0.1); }
        .blob-2 { position: absolute; bottom: 200px; right: -50px; width: 150px; height: 150px; background: rgba(37, 99, 235, 0.08); border-radius: 50%; }

        /* Header */
        .header {
            position: absolute; top: 60px; left: 60px; right: 60px;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .logo { height: 80px; content: url('../../5_ASSETS/logos/Chi Quyet Academy Mascot Logo.png'); }

        .pill-tag {
            background: #ffffff;
            color: var(--blue-ai);
            font-weight: 800;
            font-size: 24px;
            padding: 15px 35px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.1);
            display: flex; align-items: center; gap: 10px;
        }

        /* Main Title Area */
        .title-area {
            position: absolute; top: 250px; left: 60px; right: 60px;
        }

        .main-title {
            font-size: 96px; font-weight: 900; line-height: 1.1; letter-spacing: -2px;
        }

        .title-red { color: var(--red-cq); }
        .title-blue { color: var(--blue-ai); }
        .vs-divider { color: #94a3b8; font-size: 48px; margin: 20px 0; display: flex; align-items: center; gap: 20px; }
        .vs-divider::before, .vs-divider::after { content: ""; height: 3px; width: 60px; background: #cbd5e1; }

        .sub-description {
            margin-top: 30px; font-size: 32px; font-weight: 600; color: #334155; line-height: 1.5; max-width: 80%;
        }

        /* Comparison Cards Area */
        .cards-area {
            position: absolute; bottom: 150px; left: 60px; right: 60px;
            display: flex; gap: 30px;
        }

        .card {
            flex: 1;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card-red { background: #fffcfb; border-color: #fee2e2; }
        .card-blue { background: #f8fafc; border-color: #dbeafe; }

        .card-header { font-size: 20px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .card-red .card-header { color: var(--red-cq); }
        .card-blue .card-header { color: var(--blue-ai); }

        .card-title { font-size: 32px; font-weight: 800; color: #0f172a; line-height: 1.3; }

        /* Footer */
        .footer {
            position: absolute; bottom: 50px; left: 60px; right: 60px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .footer-brand { display: flex; align-items: center; gap: 15px; font-weight: 800; font-size: 24px; color: var(--blue-ai); }
        .footer-swipe { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 24px; color: #64748b; }
        .swipe-btn { width: 50px; height: 50px; background: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); color: #0f172a; }

    </style>
</head>
<body>
    <div class="blob-1"></div><div class="blob-2"></div>

    <div class="header">
        <img class="logo" alt="Logo">
        <div class="pill-tag">★ SEO VS GEO</div>
    </div>

    <div class="title-area">
        <div class="main-title title-red">SEO truyền thống</div>
        <div class="vs-divider">VS</div>
        <div class="main-title title-blue">SEO thời AI</div>
        <div class="sub-description" id="dynamic-desc">SEO không chết. Nhưng cách làm SEO cũ đang chết. <b>Từ tối ưu để đứng Top Google ➝ tối ưu để được AI trích dẫn.</b></div>
    </div>

    <div class="cards-area">
        <div class="card card-red">
            <div class="card-header">✖ SEO TRUYỀN THỐNG</div>
            <div class="card-title">Lên Top 10 Google</div>
        </div>
        <div class="card card-blue">
            <div class="card-header">✔ SEO THỜI AI • GEO</div>
            <div class="card-title">Được AI trích dẫn</div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-brand"><span style="background:var(--blue-ai); color:white; padding: 5px 10px; border-radius:8px;">★</span> CHÍ QUYẾT ACADEMY</div>
        <div class="footer-swipe">Vuốt xem <div class="swipe-btn">➝</div></div>
    </div>
</body>
</html>
