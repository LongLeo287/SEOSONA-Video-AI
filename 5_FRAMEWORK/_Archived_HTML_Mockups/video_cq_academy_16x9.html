<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Video Template 16:9 (CQ Academy Glassmorphism)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            margin: 0; padding: 0; width: 1920px; height: 1080px;
            background: linear-gradient(135deg, #ffffff 0%, #eff6ff 100%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Abstract Background */
        .blob-1 { position: absolute; top: -200px; right: -200px; width: 800px; height: 800px; background: rgba(37, 99, 235, 0.05); border-radius: 50%; }

        .safe-zone {
            position: absolute; top: 8%; bottom: 8%; left: 8%; right: 8%;
            display: flex; gap: 60px;
        }

        .left-col {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
        }

        .right-col {
            flex: 1; background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border-radius: 40px; border: 1px solid rgba(255,255,255,1);
            box-shadow: 0 40px 80px rgba(37, 99, 235, 0.1);
            padding: 60px;
            display: flex; flex-direction: column; justify-content: center;
        }

        .logo { height: 100px; margin-bottom: 50px; content: url('../../5_ASSETS/logos/Chi Quyet Academy Mascot Logo.png'); }

        .title { font-size: 80px; font-weight: 900; color: #0f172a; line-height: 1.1; margin-bottom: 30px; }
        .title-highlight { color: #2563eb; }

        .visual-img { width: 100%; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

        .subtitle-bar {
            position: absolute; bottom: 8%; left: 8%; right: 8%;
            background: #0f172a; color: white; padding: 30px 60px;
            border-radius: 20px; font-size: 48px; font-weight: 800; text-align: center;
            border-left: 10px solid #2563eb;
        }
        .kinetic-word { display: inline-block; opacity: 0.5; transition: 0.1s; }
        .kinetic-word.active { opacity: 1; color: #60a5fa; transform: scale(1.05); }

    </style>
</head>
<body>
    <div class="blob-1"></div>
    <div class="safe-zone">
        <div class="left-col">
            <img class="logo">
            <div class="title">BÍ MẬT <br><span class="title-highlight">SEO THỜI AI</span></div>
            <!-- Chứa ảnh bài báo -->
            <img class="visual-img" src="../../5_ASSETS/tham_khao/724535166_984742267701988_5507095357270299590_n.jpg" alt="Visual">
        </div>
        <div class="right-col">
            <div style="font-size: 40px; font-weight: 800; color: #dc2626; margin-bottom: 30px;">✖ Sai lầm cũ</div>
            <div style="font-size: 50px; font-weight: 800; color: #0f172a; margin-bottom: 60px;">Chỉ tập trung nhồi nhét Keyword</div>
            
            <div style="font-size: 40px; font-weight: 800; color: #2563eb; margin-bottom: 30px;">✔ Giải pháp mới</div>
            <div style="font-size: 50px; font-weight: 800; color: #0f172a;">Tối ưu hóa Entity để được AI trích dẫn làm nguồn.</div>
        </div>
    </div>
    <div class="subtitle-bar">
        <span class="kinetic-word">Đây</span> <span class="kinetic-word active">là</span> <span class="kinetic-word">cách</span> <span class="kinetic-word">làm</span> <span class="kinetic-word">mới</span>.
    </div>
</body>
</html>
