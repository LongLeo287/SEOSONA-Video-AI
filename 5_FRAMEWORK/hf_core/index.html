<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"scenes_json", "type":"string", "label":"Scenes Data", "default":"[]"},
  {"id":"words_json", "type":"string", "label":"Subtitles Data", "default":"[]"},
  {"id":"audio_path", "type":"string", "label":"Audio File", "default":""},
  {"id":"duration", "type":"number", "label":"Total Duration", "default":10}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyperframes Core Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "MontserratLocal";
        src: url("../../5_ASSETS/fonts/Montserrat-Black.ttf") format("truetype");
        font-weight: 900;
      }
      
      body { 
        margin: 0; padding: 0; 
        font-family: "MontserratLocal", Arial, sans-serif; 
        background: #ffffff;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920" style="position: relative; width: 1080px; height: 1920px; overflow: hidden;">
      <script>
        const vars = __hyperframes.getVariables();
        let scenes = [];
        let words = [];
        try { scenes = JSON.parse(vars.scenes_json); } catch(e){}
        try { words = JSON.parse(vars.words_json); } catch(e){}

        const root = document.getElementById("root");

        // 1. Add Background B-Roll Videos
        scenes.forEach((s, idx) => {
            if (s.path) {
                const vid = document.createElement("video");
                vid.src = s.path;
                vid.setAttribute("data-start", s.start.toString());
                vid.setAttribute("data-duration", s.duration.toString());
                vid.setAttribute("data-track-index", "0"); // Background track
                vid.style.width = "1080px";
                vid.style.height = "1920px";
                vid.style.objectFit = "cover";
                vid.style.position = "absolute";
                root.appendChild(vid);
            }
        });

        // 2. Add Audio
        if (vars.audio_path) {
            const audio = document.createElement("audio");
            audio.src = vars.audio_path;
            audio.setAttribute("data-start", "0");
            root.appendChild(audio);
        }

        // 3. Karaoke Subtitles (TikTok Style Center Pop)
        const wordBox = document.createElement("div");
        wordBox.style.position = "absolute";
        wordBox.style.top = "50%";
        wordBox.style.left = "50%";
        wordBox.style.transform = "translate(-50%, -50%)";
        wordBox.style.width = "1000px";
        wordBox.style.fontSize = "160px";
        wordBox.style.fontWeight = "900";
        wordBox.style.color = "#FFD700";
        wordBox.style.textShadow = "0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(255, 215, 0, 0.5)";
        wordBox.style.textAlign = "center";
        wordBox.style.textTransform = "uppercase";
        wordBox.style.zIndex = "100";
        root.appendChild(wordBox);

        const tl = gsap.timeline({ paused: true });

        // Add a backdrop overlay to make text pop more
        const overlay = document.createElement("div");
        overlay.style.position = "absolute";
        overlay.style.width = "1080px";
        overlay.style.height = "1920px";
        overlay.style.background = "linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%)";
        overlay.style.zIndex = "50";
        root.appendChild(overlay);

        words.forEach((w) => {
            // Set word text precisely at start time
            tl.set(wordBox, { innerHTML: w.word }, w.start);
            // Elastic pop animation
            tl.fromTo(wordBox, 
                { scale: 0.5, opacity: 0 }, 
                { scale: 1.1, opacity: 1, ease: "back.out(2)", duration: 0.15, overwrite: "auto" }, 
                w.start
            );
            tl.to(wordBox, { scale: 1.0, duration: 0.1, overwrite: "auto" }, w.start + 0.15);
            
            // Hide just before next word
            tl.set(wordBox, { innerHTML: "" }, w.start + w.duration + 0.05);
        });

        // 4. Set final duration
        tl.set({}, {}, vars.duration);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      </script>
    </div>
  </body>
</html>
