<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Stats Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@800;900&display=swap');
        
        body { 
            margin: 0; padding: 0; width: 1080px; height: 1920px; 
            background-color: transparent; /* Must be transparent so video background shows through! */
            font-family: 'Space Grotesk', sans-serif; overflow: hidden; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .container {
            width: 80%;
            text-align: center;
        }

        .label {
            font-size: 40px; color: #4A60E9; letter-spacing: 5px; text-transform: uppercase;
            margin-bottom: 20px; opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s;
        }

        .number {
            font-size: 250px; font-weight: 900; line-height: 1; color: #ffffff;
            text-shadow: 0 10px 40px rgba(74, 96, 233, 0.5);
            opacity: 0; transform: scale(0.5);
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.4s;
        }

        .subtitle {
            font-size: 50px; color: #e2e8f0; font-weight: 800; margin-top: 20px; opacity: 0;
            animation: fadeUp 1s ease-out forwards;
            animation-delay: 0.8s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dành cho JS inject */
        #data-label::after { content: attr(data-content); }
        #data-number::after { content: attr(data-content); }
        #data-subtitle::after { content: attr(data-content); }
    </style>
</head>
<body>
    <div class="container">
        <div class="label" id="data-label" data-content="HIỆU SUẤT TĂNG"></div>
        <div class="number" id="data-number" data-content="300%"></div>
        <div class="subtitle" id="data-subtitle" data-content="Nhờ vào AI Agent tự động hóa"></div>
    </div>
    
    <script>
        // Khi Playwright inject data:
        window.injectData = function(label, number, subtitle) {
            document.getElementById('data-label').setAttribute('data-content', label);
            document.getElementById('data-number').setAttribute('data-content', number);
            document.getElementById('data-subtitle').setAttribute('data-content', subtitle);
        };
    </script>
</body>
</html>
