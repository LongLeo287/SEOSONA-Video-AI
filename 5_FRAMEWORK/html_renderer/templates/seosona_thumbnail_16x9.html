<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>SEOSONA Thumbnail 16x9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'sans-serif'],
                    },
                    colors: {
                        navy: '#1A2DB5',
                        brandBlue: '#1565C0',
                        lightBlue: '#BBDEFB',
                        panelBg: '#F3F6FA',
                        ink: '#0E1633',
                        brandGray: '#5A6588',
                        borderGray: '#E2E8F2',
                        brandYellow: '#FFD54F',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: #1A2DB5;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 2px, transparent 2px);
            background-size: 30px 30px;
            color: white;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 70%;
            transform: translate(-50%, -50%);
            font-size: 450px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.04);
            line-height: 1;
            z-index: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .content-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 10;
            display: flex;
            padding: 80px 100px;
        }

        /* LEFT SIDE (TEXT) */
        .left-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            z-index: 20;
        }

        .logo-container {
            background-color: white;
            padding: 12px 35px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 50px;
        }

        .logo {
            height: 55px;
            object-fit: contain;
        }

        .top-label {
            background-color: #1565C0;
            color: white;
            font-weight: 800;
            font-size: 40px;
            padding: 16px 50px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .main-title {
            font-weight: 900;
            font-size: 140px;
            line-height: 1.1;
            letter-spacing: -3px;
            margin-top: 5px;
            max-width: 1100px;
            text-shadow: 0 20px 40px rgba(0,0,0,0.8);
            text-transform: uppercase;
        }

        .title-keyword {
            color: #BBDEFB;
            border-bottom: 15px solid #BBDEFB;
            padding-bottom: 0px;
            display: inline-block;
        }

        .cta-container {
            margin-top: 60px;
            display: inline-block;
        }

        .cta-text {
            font-size: 60px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
            letter-spacing: -1px;
            background: #FFD54F;
            color: #0E1633;
            padding: 25px 60px;
            border-radius: 9999px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .cta-highlight {
            color: #1565C0;
        }

        /* RIGHT SIDE (PORTRAIT) */
        .right-section {
            flex: 0.8;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 15;
        }

        .portrait-img {
            max-height: 120%;
            max-width: 150%;
            object-fit: contain;
            filter: drop-shadow(0 0 80px rgba(187, 222, 251, 0.3));
            position: absolute;
            bottom: -80px;
            right: -50px;
            z-index: 30;
        }

        /* Floating UI Accents */
        .accent-icon {
            position: absolute;
            z-index: 10;
            opacity: 0.7;
        }
        
        .accent-top {
            right: 400px;
            top: 100px;
            width: 300px;
        }
        
        .accent-bottom {
            right: 100px;
            bottom: 200px;
            width: 250px;
        }
    </style>
</head>
<body>
    <div class="watermark">{{WATERMARK}}</div>

    <!-- Floating UI Accents -->
    <svg class="accent-icon accent-top" fill="none" viewBox="0 0 200 200" stroke="#1565C0" stroke-width="3">
        <rect x="20" y="20" width="60" height="40" rx="8" />
        <rect x="120" y="100" width="60" height="40" rx="8" />
        <path d="M50 60 v40 h70" />
        <circle cx="50" cy="100" r="5" fill="#1A2DB5" />
        <path d="M120 120 h-40 v60" stroke-dasharray="5,5" />
    </svg>
    <svg class="accent-icon accent-bottom" fill="none" viewBox="0 0 200 200" stroke="#1565C0" stroke-width="3">
        <circle cx="100" cy="50" r="30" />
        <rect x="70" y="120" width="60" height="30" rx="15" />
        <path d="M100 80 v40" />
        <path d="M40 135 h30" stroke-dasharray="5,5" />
        <path d="M130 135 h30" stroke-dasharray="5,5" />
    </svg>

    <div class="content-container">
        <!-- LEFT: TEXT -->
        <div class="left-section">
            <div class="logo-container">
                <img src="{{LOGO_PATH}}" alt="SEOSONA" class="logo">
            </div>
            <div class="top-label">{{TOP_LABEL}}</div>
            <h1 class="main-title">
                {{MAIN_TITLE_1}} <span class="title-keyword">{{MAIN_TITLE_KW}}</span> <br>{{MAIN_TITLE_2}}
            </h1>
            <div class="cta-container">
                <div class="cta-text">
                    {{CTA_1}} <span class="cta-highlight">{{CTA_KW}}</span> {{CTA_2}}
                </div>
            </div>
        </div>

        <!-- RIGHT: PORTRAIT -->
        <div class="right-section">
            <img src="{{PORTRAIT_PATH}}" alt="Character" class="portrait-img">
        </div>
    </div>
</body>
</html>
