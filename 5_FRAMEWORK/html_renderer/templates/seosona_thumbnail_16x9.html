<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>SEOSONA Thumbnail 16:9</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1920px;
            height: 1080px;
            background-color: {{COLOR_NAVY}};
            background-image: radial-gradient(rgba(255,255,255,0.12) 1.8px, transparent 1.8px);
            background-size: 32px 32px;
            color: white;
            font-family: 'Be Vietnam Pro', sans-serif;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* ── Watermark (Right-edge, cropped) ── */
        .watermark {
            position: absolute;
            top: 50%;
            right: -40px;
            transform: translateY(-50%);
            font-size: 380px;
            font-weight: 900;
            color: rgba(255,255,255,0.04);
            line-height: 0.85;
            z-index: 1;
            pointer-events: none;
            text-align: right;
            white-space: nowrap;
        }

        /* ── Floating Tech Icons ── */
        .float-icon {
            position: absolute;
            z-index: 5;
            opacity: 0.45;
        }
        .fi-chart {
            right: 380px; top: 80px;
            width: 160px; height: 160px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 18px;
        }
        .fi-ai-chip {
            right: 120px; bottom: 220px;
            width: 140px; height: 140px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 16px;
        }
        .fi-flowchart {
            right: 400px; bottom: 180px;
            width: 130px; height: 130px;
        }
        .fi-checklist {
            right: 180px; top: 100px;
            width: 110px; height: 110px;
        }

        /* ── Left Section (Text) ── */
        .left-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 80px 80px 100px;
            z-index: 20;
            position: relative;
        }
        .left-section.center-full {
            flex: 1;
            align-items: center;
            text-align: center;
            padding: 80px 120px;
        }

        .logo-pill {
            background: white;
            padding: 12px 32px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(0,0,0,0.2);
            margin-bottom: 6px;
            align-self: flex-start;
        }
        .center-full .logo-pill { align-self: center; }
        .logo-pill img {
            height: 50px;
            object-fit: contain;
        }
        .logo-tagline {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            margin-bottom: 30px;
        }
        .center-full .logo-tagline { text-align: center; }

        .top-label {
            background-color: {{COLOR_BLUE}};
            color: white;
            font-weight: 800;
            font-size: 36px;
            padding: 14px 44px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.25);
            margin-bottom: 24px;
            display: inline-block;
        }

        .main-title {
            font-weight: 900;
            font-size: 120px;
            line-height: 1.05;
            letter-spacing: -3px;
            text-transform: uppercase;
            text-shadow: 0 16px 40px rgba(0,0,0,0.7);
            max-width: 1050px;
            margin-bottom: 20px;
        }
        .center-full .main-title {
            font-size: 135px;
            text-align: center;
            max-width: 1600px;
        }
        .title-keyword {
            color: {{COLOR_LIGHT_BLUE}};
            border-bottom: 12px solid {{COLOR_LIGHT_BLUE}};
            padding-bottom: 2px;
            display: inline;
        }

        .subtext-italic {
            font-size: 26px;
            font-weight: 400;
            font-style: italic;
            color: rgba(255,255,255,0.65);
            max-width: 800px;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        .cta-pill {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: {{COLOR_YELLOW}};
            border-radius: 9999px;
            padding: 22px 55px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        }
        .cta-pill .cta-text {
            font-size: 52px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: #0E1633;
            white-space: nowrap;
        }
        .cta-highlight {
            color: {{COLOR_BLUE}};
        }
        .cta-arrows {
            font-size: 46px;
            font-weight: 900;
            color: {{COLOR_BLUE}};
            margin-left: 6px;
        }

        /* ── Right Section (Portrait) ── */
        .right-section {
            flex: 0.8;
            position: relative;
            z-index: 15;
        }
        .right-section img {
            position: absolute;
            bottom: -60px;
            right: -30px;
            max-height: 115%;
            max-width: 140%;
            object-fit: contain;
            filter: drop-shadow(0 0 70px rgba(187,222,251,0.3));
            z-index: 16;
        }
    </style>
</head>
<body>
    <!-- Watermark (Right edge, cropped) -->
    <div class="watermark">{{WATERMARK}}</div>

    <!-- Floating Tech Icons -->
    <div class="float-icon fi-chart">
        <svg viewBox="0 0 124 124" fill="none" stroke="{{COLOR_BLUE}}" stroke-width="2.5">
            <rect x="8" y="70" width="22" height="44" rx="4" fill="rgba(255,255,255,0.08)"/>
            <rect x="38" y="44" width="22" height="70" rx="4" fill="rgba(255,255,255,0.08)"/>
            <rect x="68" y="24" width="22" height="90" rx="4" fill="rgba(255,255,255,0.08)"/>
            <polyline points="19,66 49,40 79,20" stroke="{{COLOR_LIGHT_BLUE}}" stroke-width="2" fill="none"/>
            <circle cx="19" cy="66" r="3.5" fill="{{COLOR_LIGHT_BLUE}}"/>
            <circle cx="49" cy="40" r="3.5" fill="{{COLOR_LIGHT_BLUE}}"/>
            <circle cx="79" cy="20" r="3.5" fill="{{COLOR_LIGHT_BLUE}}"/>
        </svg>
    </div>
    <div class="float-icon fi-ai-chip">
        <svg viewBox="0 0 108 108" fill="none" stroke="{{COLOR_BLUE}}" stroke-width="2">
            <rect x="24" y="24" width="60" height="60" rx="12" fill="rgba(255,255,255,0.06)"/>
            <circle cx="54" cy="54" r="14" stroke="{{COLOR_LIGHT_BLUE}}"/>
            <circle cx="54" cy="54" r="5" fill="{{COLOR_LIGHT_BLUE}}" stroke="none"/>
            <line x1="54" y1="6" x2="54" y2="24"/><line x1="54" y1="84" x2="54" y2="102"/>
            <line x1="6" y1="54" x2="24" y2="54"/><line x1="84" y1="54" x2="102" y2="54"/>
            <text x="54" y="58" font-family="sans-serif" font-size="14" fill="{{COLOR_LIGHT_BLUE}}" text-anchor="middle" stroke="none" font-weight="700">AI</text>
        </svg>
    </div>
    <div class="float-icon fi-flowchart">
        <svg viewBox="0 0 130 130" fill="none" stroke="{{COLOR_BLUE}}" stroke-width="2">
            <rect x="30" y="10" width="70" height="30" rx="8" fill="rgba(255,255,255,0.06)"/>
            <line x1="65" y1="40" x2="65" y2="55"/>
            <line x1="65" y1="55" x2="30" y2="55"/><line x1="65" y1="55" x2="100" y2="55"/>
            <rect x="5" y="65" width="50" height="25" rx="6" fill="rgba(255,255,255,0.06)"/>
            <rect x="75" y="65" width="50" height="25" rx="6" fill="rgba(255,255,255,0.06)"/>
            <line x1="30" y1="55" x2="30" y2="65"/><line x1="100" y1="55" x2="100" y2="65"/>
        </svg>
    </div>
    <div class="float-icon fi-checklist">
        <svg viewBox="0 0 110 110" fill="none" stroke="{{COLOR_BLUE}}" stroke-width="2">
            <rect x="10" y="10" width="90" height="90" rx="14" fill="rgba(255,255,255,0.06)"/>
            <polyline points="28,46 38,56 52,38" stroke="{{COLOR_LIGHT_BLUE}}" stroke-width="2.5"/>
            <line x1="62" y1="46" x2="82" y2="46" stroke-width="2"/>
            <polyline points="28,70 38,80 52,62" stroke="{{COLOR_LIGHT_BLUE}}" stroke-width="2.5"/>
            <line x1="62" y1="70" x2="82" y2="70" stroke-width="2"/>
            <line x1="28" y1="28" x2="82" y2="28" stroke-width="2"/>
        </svg>
    </div>

    <div style="position:absolute;inset:0;z-index:10;display:flex;">
        <!-- LEFT: Text -->
        <div class="left-section {{TEXT_ALIGN_CLASS}}">
            <div class="logo-pill">
                <img src="{{LOGO_PATH}}" alt="Logo">
            </div>
            <div class="logo-tagline">{{BRAND_TAGLINE}}</div>
            <div class="top-label">{{TOP_LABEL}}</div>
            <h1 class="main-title">
                {{MAIN_TITLE_1}} <span class="title-keyword">{{MAIN_TITLE_KW}}</span><br>{{MAIN_TITLE_2}}
            </h1>
            <p class="subtext-italic" style="{{SUBTEXT_STYLE}}">{{SUBTEXT_ITALIC}}</p>
            <div class="cta-pill">
                <span class="cta-text">
                    {{CTA_1}} <span class="cta-highlight">{{CTA_KW}}</span> {{CTA_2}}
                </span>
                <span class="cta-arrows">»</span>
            </div>
        </div>

        <!-- RIGHT: Portrait -->
        <div class="right-section" style="{{PORTRAIT_STYLE}}">
            <img src="{{PORTRAIT_PATH}}" alt="Character">
        </div>
    </div>
</body>
</html>
