<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px; height: 1080px;
  background: linear-gradient(180deg, #EDE7F6 0%, #F5F3FF 40%, #E8EAF6 100%);
  font-family: 'Inter', sans-serif;
  color: #1A2DB5;
  overflow: hidden;
  position: relative;
}

/* ── Grid nền ── */
.grid-bg {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(26,45,181,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,45,181,0.06) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* ── Glow orbs ── */
.orb { position: absolute; border-radius: 50%; filter: blur(80px); }
.orb-1 { width: 350px; height: 350px; background: #1A2DB5; top: 200px; left: 50%; transform: translateX(-50%); opacity: 0.08; }
.orb-2 { width: 200px; height: 200px; background: #1565C0; top: 400px; left: 50%; transform: translateX(-50%); opacity: 0.06; }

/* ── HUD Top Bar ── */
.hud-top {
  position: absolute; top: 0; left: 0; right: 0;
  height: 72px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px;
  border-bottom: 1px solid rgba(26,45,181,0.12);
  z-index: 10;
}
.hud-logo img { height: 36px; }
.hud-label {
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  color: #1565C0; text-transform: uppercase;
}
.hud-counter {
  font-size: 12px; font-weight: 600; color: rgba(26,45,181,0.4);
  letter-spacing: 1px;
}
.hud-counter span { color: #1A2DB5; font-weight: 800; font-size: 20px; margin-right: 4px; }

/* ── Section Label ── */
.section-label {
  position: absolute; top: 100px; left: 48px;
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  color: #1565C0; text-transform: uppercase;
}
.section-label::before {
  content: ''; display: inline-block;
  width: 8px; height: 8px; border-radius: 50%;
  background: #1A2DB5; margin-right: 10px;
  box-shadow: 0 0 8px rgba(26,45,181,0.4);
}

/* ── Heading ── */
.heading {
  position: absolute; top: 140px; left: 48px; right: 48px;
  font-size: 34px; font-weight: 900; line-height: 1.2;
  color: #1A2DB5; text-align: center;
}
.heading .hl { color: #1565C0; }

/* ── SVG Path Container ── */
.path-container {
  position: absolute; top: 220px; left: 0; right: 0;
  height: 600px;
  display: flex; align-items: center; justify-content: center;
}

.path-svg {
  width: 960px; height: 520px;
}

/* ── Node Styles ── */
.node-group text.node-number {
  font-family: 'Inter', sans-serif;
  font-size: 14px; font-weight: 900;
  fill: #1A2DB5;
}
.node-group text.node-title {
  font-family: 'Inter', sans-serif;
  font-size: 15px; font-weight: 800;
  fill: #1A2DB5;
}
.node-group text.node-desc {
  font-family: 'Inter', sans-serif;
  font-size: 12px; font-weight: 500;
  fill: rgba(26,45,181,0.5);
}

/* ── Bottom Band ── */
.bottom-band {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(90deg, #1A2DB5, #1565C0);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px;
}
.bottom-text { font-size: 15px; font-weight: 700; color: #fff; }
.bottom-text .hl { color: #BBDEFB; }
.bottom-cta {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 800; color: #BBDEFB;
  letter-spacing: 1px; text-transform: uppercase;
}
.bottom-cta .arrow {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

/* ── Watermark ── */
.watermark {
  position: absolute; right: -20px; top: 50%;
  transform: translateY(-50%) rotate(-90deg);
  font-size: 120px; font-weight: 900;
  color: rgba(26,45,181,0.04);
  letter-spacing: 20px;
  pointer-events: none;
}
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="watermark">SEO</div>

  <!-- HUD -->
  <div class="hud-top">
    <div class="hud-logo"><img src="{{LOGO_PATH}}" alt="SEOSONA"></div>
    <div class="hud-label">{{SECTION_LABEL}}</div>
    <div class="hud-counter"><span>{{SLIDE_NUMBER}}</span> / {{TOTAL_SLIDES}}</div>
  </div>

  <div class="section-label">{{TAG}}</div>
  <div class="heading">{{HEADING_1}} <span class="hl">{{HEADING_HL}}</span> {{HEADING_2}}</div>

  <!-- Process Path (SVG) -->
  <div class="path-container">
    <svg class="path-svg" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg">
      <!-- Connecting Path -->
      <path d="M 120 100 C 240 100, 240 260, 360 260 C 480 260, 480 100, 600 100 C 720 100, 720 260, 840 260"
            fill="none" stroke="url(#pathGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
      <path d="M 120 100 C 240 100, 240 260, 360 260 C 480 260, 480 100, 600 100 C 720 100, 720 260, 840 260"
            fill="none" stroke="url(#pathGrad)" stroke-width="6" opacity="0.05" filter="url(#glow)"/>

      <defs>
        <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1A2DB5"/>
          <stop offset="50%" stop-color="#1565C0"/>
          <stop offset="100%" stop-color="#1A2DB5"/>
        </linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
      </defs>

      <!-- Node 1 -->
      <g class="node-group">
        <circle cx="120" cy="100" r="24" fill="#F5F3FF" stroke="#1A2DB5" stroke-width="2"/>
        <circle cx="120" cy="100" r="8" fill="#1A2DB5"/>
        <circle cx="120" cy="100" r="16" fill="none" stroke="#1565C0" stroke-width="1" opacity="0.3"/>
        <text class="node-number" x="120" y="60" text-anchor="middle">01</text>
        <text class="node-title" x="120" y="155" text-anchor="middle">{{STEP_1_TITLE}}</text>
        <text class="node-desc" x="120" y="175" text-anchor="middle">{{STEP_1_DESC}}</text>
      </g>

      <!-- Node 2 -->
      <g class="node-group">
        <circle cx="360" cy="260" r="24" fill="#F5F3FF" stroke="#1A2DB5" stroke-width="2"/>
        <circle cx="360" cy="260" r="8" fill="#1A2DB5"/>
        <circle cx="360" cy="260" r="16" fill="none" stroke="#1565C0" stroke-width="1" opacity="0.3"/>
        <text class="node-number" x="360" y="220" text-anchor="middle">02</text>
        <text class="node-title" x="360" y="315" text-anchor="middle">{{STEP_2_TITLE}}</text>
        <text class="node-desc" x="360" y="335" text-anchor="middle">{{STEP_2_DESC}}</text>
      </g>

      <!-- Node 3 -->
      <g class="node-group">
        <circle cx="600" cy="100" r="24" fill="#F5F3FF" stroke="#1A2DB5" stroke-width="2"/>
        <circle cx="600" cy="100" r="8" fill="#1A2DB5"/>
        <circle cx="600" cy="100" r="16" fill="none" stroke="#1565C0" stroke-width="1" opacity="0.3"/>
        <text class="node-number" x="600" y="60" text-anchor="middle">03</text>
        <text class="node-title" x="600" y="155" text-anchor="middle">{{STEP_3_TITLE}}</text>
        <text class="node-desc" x="600" y="175" text-anchor="middle">{{STEP_3_DESC}}</text>
      </g>

      <!-- Node 4 -->
      <g class="node-group">
        <circle cx="840" cy="260" r="24" fill="#F5F3FF" stroke="#1A2DB5" stroke-width="2"/>
        <circle cx="840" cy="260" r="8" fill="#1A2DB5"/>
        <circle cx="840" cy="260" r="16" fill="none" stroke="#1565C0" stroke-width="1" opacity="0.3"/>
        <text class="node-number" x="840" y="220" text-anchor="middle">04</text>
        <text class="node-title" x="840" y="315" text-anchor="middle">{{STEP_4_TITLE}}</text>
        <text class="node-desc" x="840" y="335" text-anchor="middle">{{STEP_4_DESC}}</text>
      </g>

      <!-- Stats Row -->
      <g>
        <rect x="60" y="400" width="240" height="80" rx="12" fill="rgba(255,255,255,0.7)" stroke="rgba(26,45,181,0.1)" stroke-width="1"/>
        <text x="180" y="432" text-anchor="middle" font-family="Inter" font-size="28" font-weight="900" fill="#1A2DB5">{{STAT_1_VALUE}}</text>
        <text x="180" y="458" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="rgba(26,45,181,0.4)" letter-spacing="2">{{STAT_1_LABEL}}</text>
      </g>
      <g>
        <rect x="360" y="400" width="240" height="80" rx="12" fill="rgba(255,255,255,0.7)" stroke="rgba(26,45,181,0.1)" stroke-width="1"/>
        <text x="480" y="432" text-anchor="middle" font-family="Inter" font-size="28" font-weight="900" fill="#1A2DB5">{{STAT_2_VALUE}}</text>
        <text x="480" y="458" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="rgba(26,45,181,0.4)" letter-spacing="2">{{STAT_2_LABEL}}</text>
      </g>
      <g>
        <rect x="660" y="400" width="240" height="80" rx="12" fill="rgba(255,255,255,0.7)" stroke="rgba(26,45,181,0.1)" stroke-width="1"/>
        <text x="780" y="432" text-anchor="middle" font-family="Inter" font-size="28" font-weight="900" fill="#1A2DB5">{{STAT_3_VALUE}}</text>
        <text x="780" y="458" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="rgba(26,45,181,0.4)" letter-spacing="2">{{STAT_3_LABEL}}</text>
      </g>
    </svg>
  </div>

  <!-- Bottom Band -->
  <div class="bottom-band">
    <div class="bottom-text">{{BOTTOM_TEXT}} <span class="hl">{{BOTTOM_HL}}</span></div>
    <div class="bottom-cta">{{CTA_TEXT}} <span class="arrow">→</span></div>
  </div>
</body>
</html>
