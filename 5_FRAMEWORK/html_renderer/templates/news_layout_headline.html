<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>SEOSONA News — Headline Layout</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* CSS Variables & Global Settings */
:root {
  --navy: #1A2DB5; --blue: #1565C0; --light-blue: #BBDEFB;
  --bg-start: #EDE7F6; --bg-mid: #F5F3FF; --bg-end: #E8EAF6;
  --card-bg: rgba(255,255,255,0.72); --card-border: rgba(26,45,181,0.10);
  --text: #1A2DB5; --text-sub: #546E7A; --text-muted: rgba(26,45,181,0.4);
  --dot-color: rgba(26,45,181,0.04);
}
html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-mid) 40%, var(--bg-end) 100%); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

/* Persistent Elements */
.dots-grid { position: absolute; inset: 0; background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px); background-size: 50px 50px; z-index: 0; }
.watermark { position: absolute; top: -60px; right: -80px; font-size: 600px; font-weight: 900; color: rgba(26,45,181,0.025); line-height: 1; z-index: 0; pointer-events: none; }
.hud-top { position: absolute; top: 0; left: 0; right: 0; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; border-bottom: 1px solid rgba(26,45,181,0.08); z-index: 100; }
.hud-label, .hud-counter { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }
.logo-center { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); z-index: 100; }
.logo-center img { height: 40px; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(90deg, var(--navy), var(--blue)); display: flex; align-items: center; justify-content: center; z-index: 100; }
.footer span { color: rgba(255,255,255,0.8); font-size: 18px; font-weight: 600; letter-spacing: 1px; }
.subtitle-area { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); width: 900px; text-align: center; z-index: 50; }
.subtitle-text { font-size: 32px; font-weight: 700; line-height: 1.3; color: var(--text); }
.subtitle-text .kw { color: var(--blue); font-weight: 800; }

/* Node & Card */
.node { position: absolute; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #fff; z-index: 10; box-shadow: 0 0 20px rgba(26,45,181,0.15); background: var(--navy); top: 400px; left: 56px; }
.node::after { content: ''; position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 1px solid currentColor; opacity: 0.2; }
.orbit-ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(26,45,181,0.12); z-index: 5; width: 280px; height: 280px; top: 360px; left: 180px; }
.orbit-ring .orbit-dot { position: absolute; top: -4px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--navy); }
.glass-card { position: absolute; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 32px; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(26,45,181,0.06); z-index: 10; top: 480px; left: 56px; right: 60px; }
.card-tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 2px; padding: 5px 14px; border-radius: 6px; text-transform: uppercase; margin-bottom: 12px; background: rgba(26,45,181,0.08); color: var(--navy); }
.card-heading { font-size: 36px; font-weight: 900; line-height: 1.15; color: var(--text); margin-bottom: 8px; }
.card-heading .hl { color: var(--blue); }
.card-sub { font-size: 16px; font-weight: 500; line-height: 1.6; color: var(--text-sub); }
.path-svg { position: absolute; inset: 0; width: 1080px; height: 1920px; z-index: 3; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="news-headline" data-start="0" data-duration="{{DURATION}}">
  <div class="dots-grid"></div>
  <div class="watermark">{{WATERMARK}}</div>
  <div class="hud-top"><div class="hud-label">SPATIAL FLOW</div><div class="hud-counter">{{CURRENT_INDEX}}/{{TOTAL_POINTS}} ĐIỂM NỘI DUNG</div></div>
  <div class="logo-center"><img src="{{LOGO_PATH}}" alt="SEOSONA"></div>
  <svg class="path-svg" viewBox="0 0 1080 1920"><path d="M 90 430 C 90 600, 540 700, 540 800" fill="none" stroke="rgba(26,45,181,0.18)" stroke-width="2" stroke-dasharray="8 6"/><rect x="533" y="747" width="14" height="14" transform="rotate(45 540 754)" fill="none" stroke="rgba(26,45,181,0.15)" stroke-width="1.5"/></svg>

  <div class="node">{{WATERMARK}}</div>
  <div class="orbit-ring"><div class="orbit-dot"></div></div>
  <div class="glass-card">
    <div class="card-tag">{{TAG}}</div>
    <div class="card-heading">{{HEADING}} <span class="hl">{{HIGHLIGHT}}</span></div>
    <div class="card-sub">{{SUBTEXT}}</div>
  </div>

  <div class="subtitle-area"><div class="subtitle-text">{{SUBTITLE}}</div></div>
  <div class="footer"><span>SEOSONA · Share to be shared more</span></div>
</div>
<script>
  gsap.from(".node", { scale: 0, opacity: 0, duration: 0.5, ease: "back.out(1.7)", delay: 0.2 });
  gsap.from(".orbit-ring", { scale: 0.5, opacity: 0, duration: 0.8, ease: "power3.out", delay: 0.3 });
  gsap.from(".glass-card", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out", delay: 0.5 });
  gsap.from(".card-tag", { x: -20, opacity: 0, duration: 0.4, delay: 0.7 });
  gsap.from(".card-heading", { y: 20, opacity: 0, duration: 0.5, delay: 0.8 });
  gsap.from(".card-sub", { y: 15, opacity: 0, duration: 0.4, delay: 1.0 });
  gsap.to(".orbit-ring", { rotation: 360, duration: 20, repeat: -1, ease: "none" });
</script>
</body>
</html>
