os:
  name: "SEOSONA Video Factory"
  version: "3.0.0"
  workspace_path: "8_WORKSPACE"
  features:
    auto_upload_gdrive: false
    use_humanizer: true
    use_hermes_validation: true

render:
  resolution: [1080, 1920]
  fps: 30
  codec: "libx264"
  audio_codec: "aac"

platforms:
  youtube:
    video: {width: 1920, height: 1080, ratio: "16:9"}
    thumbnail: {width: 1280, height: 720}
    shorts: {width: 1080, height: 1920, ratio: "9:16"}
  tiktok:
    video: {width: 1080, height: 1920, ratio: "9:16"}
    thumbnail: {width: 1080, height: 1920}
  reels:
    video: {width: 1080, height: 1920, ratio: "9:16"}
    thumbnail: {width: 1080, height: 1920}

profiles:
  seosona:
    description: "Business oriented, professional, 100% Light Mode"
    colors:
      primary: "#FFFFFF"
      secondary: "#F8FAFC"
      text: "#0F172A"
      highlight: "#F97316"
      background: "#FFFFFF"
    fonts:
      main: "BeVietnamPro-Bold"
      size: 70
    voice:
      # BRAND VOICE = OmniVoice cloning the Chí Quyết (CQA) voice — same voice for BOTH brands
      # (user decision 2026-06-29; 2026-07-14: OmniVoice is the ONLY engine, no backup).
      engine: "omnivoice"
      reference_audio: "7_ASSETS/voice/profiles/cqa_omnivoice_ref.wav"
      required_gender: "male"
      required_accent: "southern"
      backup_engine: "none"
    logo: "Seosona_Logo.png"
    animation: "slide_up"
    brand_tone: "Professional, reputable, market-leading, sharp insights"
    target_audience: "Entrepreneurs, Marketers, SEO Specialists"

  cqa:
    description: "Fun, creator-focused, dynamic, 100% Light Mode"
    colors:
      primary: "#F4F7FF"
      secondary: "#FFFFFF"
      text: "#1A1D2B"
      highlight: "#4A60E9"
      background: "#F4F7FF"
    fonts:
      main: "BeVietnamPro-Black"
      size: 90
    voice:
      # BRAND VOICE = OmniVoice cloning the Chí Quyết (CQA) voice (voice_router: OmniVoice ONLY, no backup).
      engine: "omnivoice"
      reference_audio: "7_ASSETS/voice/profiles/cqa_omnivoice_ref.wav"
      required_gender: "male"
      required_accent: "southern"
      backup_engine: "none"
    logo: "Chi Quyet Academy Mascot Logo.png"
    animation: "elastic_pop"
    brand_tone: "Fun, approachable, inspiring, easy to understand"
    target_audience: "SEO beginners, Creators, Freelancers"

api_keys:
  # NOTE: Do not put real Keys here. The system will automatically read from the .env file
  pexels: "${PEXELS_API_KEY}"
  openai: "${OPENAI_API_KEY}"

whisper:
  model: "turbo"
  language: "vi"
  word_timestamps: true
  hallucination_silence_threshold: 2

sfx:
  pop_dir: "7_ASSETS/audio/sfx/pops"
  transition_dir: "7_ASSETS/audio/sfx/transitions"
  pop_volume: 0.3
  transition_volume: 0.6

bgm:
  dir: "7_ASSETS/audio/bgm"
  default_mood: "tech"
  volume:
    seosona: 0.08
    cqa: 0.12
  fade_in: 1.0
  fade_out: 2.0
