os:
  name: "SEOSONA Video Factory"
  version: "3.0.0"
  workspace_path: "8_WORKSPACE"
  features:
    auto_upload_gdrive: false
    use_humanizer: true
    use_hermes_validation: true

render:
  resolution: [1080, 1920]
  fps: 30
  codec: "libx264"
  audio_codec: "aac"

platforms:
  youtube:
    video: {width: 1920, height: 1080, ratio: "16:9"}
    thumbnail: {width: 1280, height: 720}
    shorts: {width: 1080, height: 1920, ratio: "9:16"}
  tiktok:
    video: {width: 1080, height: 1920, ratio: "9:16"}
    thumbnail: {width: 1080, height: 1920}
  reels:
    video: {width: 1080, height: 1920, ratio: "9:16"}
    thumbnail: {width: 1080, height: 1920}

profiles:
  seosona:
    description: "Business oriented, professional, 100% Light Mode"
    colors:
      primary: "#FFFFFF"
      secondary: "#F8FAFC"
      text: "#0F172A"
      highlight: "#F97316"
      background: "#FFFFFF"
    fonts:
      main: "BeVietnamPro-Bold"
      size: 70
    voice:
      engine: "vieneu"
      # PRIMARY: clone the Southern male brand voice from this 13s clip. A/B tested
      # 2026-06-29 (scripts/build_voice_ref.py + MFCC/pitch similarity vs the source):
      # this hand-picked 13s clip clones BEST (timbre 0.944) — it beat auto-built clean
      # windows AND the raw 77s recording (0.784, worst: feeding 77s makes VieNeu drone).
      # The raw seosona.WAV stays local as the source for any future LoRA fine-tune.
      reference_audio: "7_ASSETS/voice/profiles/seosona_ref13.wav"
      required_gender: "male"
      required_accent: "southern"
      # Preset used ONLY if the reference is missing (router prefers the clone).
      model: "Trọng Hữu"
      # Fallback runs only if VieNeu fails — NORTHERN, NOT the brand voice.
      fallback_voice: "vi-VN-NamMinhNeural"
    logo: "Seosona_Logo.png"
    animation: "slide_up"
    brand_tone: "Professional, reputable, market-leading, sharp insights"
    target_audience: "Entrepreneurs, Marketers, SEO Specialists"

  cqa:
    description: "Fun, creator-focused, dynamic, 100% Light Mode"
    colors:
      primary: "#F4F7FF"
      secondary: "#FFFFFF"
      text: "#1A1D2B"
      highlight: "#4A60E9"
      background: "#F4F7FF"
    fonts:
      main: "BeVietnamPro-Black"
      size: 90
    voice:
      engine: "vieneu"
      # PRIMARY: clone from a CQA brand voice recording once recorded. Drop a 10-30s
      # clean clip here (male Southern VN, no noise). Missing → falls back to preset.
      # TODO: record and save as 7_ASSETS/voice/profiles/chiquyet_ref.wav
      reference_audio: "7_ASSETS/voice/profiles/chiquyet_ref.wav"
      # Single approved brand voice (locked system-wide in voice_router.APPROVED_VOICE).
      model: "Trọng Hữu"
      required_gender: "male"
      required_accent: "southern"
      fallback_engine: "edge-tts"
      fallback_voice: "vi-VN-NamMinhNeural"
    logo: "Chi Quyet Academy Mascot Logo.png"
    animation: "elastic_pop"
    brand_tone: "Fun, approachable, inspiring, easy to understand"
    target_audience: "SEO beginners, Creators, Freelancers"

api_keys:
  # NOTE: Do not put real Keys here. The system will automatically read from the .env file
  pexels: "${PEXELS_API_KEY}"
  openai: "${OPENAI_API_KEY}"

whisper:
  model: "turbo"
  language: "vi"
  word_timestamps: true
  hallucination_silence_threshold: 2

sfx:
  pop_dir: "7_ASSETS/audio/sfx/pops"
  transition_dir: "7_ASSETS/audio/sfx/transitions"
  pop_volume: 0.3
  transition_volume: 0.6

bgm:
  dir: "7_ASSETS/audio/bgm"
  default_mood: "tech"
  volume:
    seosona: 0.08
    cqa: 0.12
  fade_in: 1.0
  fade_out: 2.0
