<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-core: #090B14;
  --bg-deep: #05060A;
  
  --c-cyan: #40E0D0;
  --c-yellow: #FFDF00;
  --c-magenta: #FF007A;
  --c-purple: #8A2BE2;
  --c-green: #00FF88;
  
  --text-main: #FFFFFF;
  --text-dim: #8C92A6;
  --text-label: #B0B8CC;
  
  --font: 'Be Vietnam Pro', sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px; height: 1920px; overflow: hidden;
  background: var(--bg-deep); font-family: var(--font); color: var(--text-main);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}

.title {
  position: absolute; top: 180px; text-align: center; width: 100%;
}
.title-main {
  font-size: 64px; font-weight: 900; color: var(--text-main); margin-bottom: 20px;
}
.title-sub {
  font-size: 32px; font-weight: 600; color: var(--c-cyan);
}

/* Diagram */
.diagram {
  position: relative; width: 800px; height: 900px; margin-top: 100px;
}

/* Nodes */
.node {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: 400px; padding: 40px; border-radius: 20px;
  background: var(--bg-core); border: 2px solid var(--text-dim);
  text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  opacity: 0;
}
.node-title { font-size: 36px; font-weight: 800; margin-bottom: 10px; }
.node-desc { font-size: 20px; font-weight: 500; color: var(--text-label); }

#node1 { top: 0; border-color: var(--c-cyan); }
#node1 .node-title { color: var(--c-cyan); }

#node2 { top: 350px; border-color: var(--c-purple); }
#node2 .node-title { color: var(--c-purple); }

#node3 { top: 700px; border-color: var(--c-magenta); }
#node3 .node-title { color: var(--c-magenta); }

/* Edges */
.edge {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: 4px; background: rgba(255,255,255,0.1); z-index: -1;
}
#edge1 { top: 150px; height: 200px; }
#edge2 { top: 500px; height: 200px; }

/* Data Flow Packets */
.packet {
  position: absolute; left: -8px; width: 20px; height: 20px; border-radius: 50%;
  opacity: 0; box-shadow: 0 0 20px currentColor;
}
#p1 { background: var(--c-cyan); color: var(--c-cyan); top: 0; }
#p2 { background: var(--c-magenta); color: var(--c-magenta); top: 0; }

/* Caption */
.caption {
  position: absolute; bottom: 200px; font-size: 40px; font-weight: 700;
  text-align: center; width: 900px; line-height: 1.5;
}
.caption .hl { color: var(--c-yellow); }

/* Summary List */
.summary {
  position: absolute; top: 300px; left: 100px; width: 880px; opacity: 0; pointer-events: none;
}
.s-item {
  background: rgba(255,255,255,0.05); border-left: 8px solid var(--c-cyan);
  padding: 40px; border-radius: 0 20px 20px 0; margin-bottom: 40px;
  transform: translateX(100px); opacity: 0;
}
.s-num {
  font-size: 24px; font-weight: 900; color: var(--c-cyan); margin-bottom: 10px; letter-spacing: 2px;
}
.s-text { font-size: 32px; font-weight: 600; line-height: 1.4; }

</style>
</head>
<body data-composition-id="codebase-memory-diagram" data-width="1080" data-height="1920" data-duration="40" data-fps="30">

<div class="title" id="mainTitle">
  <div class="title-main">KIẾN TRÚC XỬ LÝ</div>
  <div class="title-sub">Quy trình tối ưu hóa dữ liệu</div>
</div>

<div class="diagram" id="diagramArea">
  <div class="edge" id="edge1"><div class="packet" id="p1"></div></div>
  <div class="edge" id="edge2"><div class="packet" id="p2"></div></div>

  <div class="node" id="node1">
    <div class="node-title">Nguồn Dữ Liệu</div>
    <div class="node-desc">Hệ thống tệp cục bộ</div>
  </div>
  <div class="node" id="node2">
    <div class="node-title">Bộ Vi Xử Lý</div>
    <div class="node-desc">Phân tích & Phân nhóm</div>
  </div>
  <div class="node" id="node3">
    <div class="node-title">Knowledge Graph</div>
    <div class="node-desc">Lưu trữ có cấu trúc</div>
  </div>
</div>

<div class="caption" id="capText">Hệ thống xử lý hoàn toàn <span class="hl">Local</span></div>

<div class="summary" id="summaryArea">
  <div class="s-item">
    <div class="s-num">01</div>
    <div class="s-text">Giảm tải băng thông gửi lên Cloud</div>
  </div>
  <div class="s-item" style="border-left-color: var(--c-magenta);">
    <div class="s-num" style="color: var(--c-magenta);">02</div>
    <div class="s-text">Bảo mật tuyệt đối cho Source Code</div>
  </div>
  <div class="s-item" style="border-left-color: var(--c-yellow);">
    <div class="s-num" style="color: var(--c-yellow);">03</div>
    <div class="s-text">Tốc độ truy xuất tăng 300%</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script>
  const DURATION = 40;
  window.__timelines = {};
  const tl = gsap.timeline({ paused: true });
  tl.totalDuration(DURATION);

  // Intro
  tl.from('.title-main', { y: -50, opacity: 0, duration: 1, ease: "power3.out" }, 1);
  tl.from('.title-sub', { y: -30, opacity: 0, duration: 1, ease: "power3.out" }, 1.3);

  // Build diagram
  tl.to('#node1', { y: 0, opacity: 1, duration: 1, ease: "back.out(1.2)" }, 2);
  tl.to('#edge1', { height: 200, opacity: 1, duration: 0.5 }, 3);
  tl.to('#node2', { y: 0, opacity: 1, duration: 1, ease: "back.out(1.2)" }, 3.5);
  tl.to('#edge2', { height: 200, opacity: 1, duration: 0.5 }, 4.5);
  tl.to('#node3', { y: 0, opacity: 1, duration: 1, ease: "back.out(1.2)" }, 5);

  // Data flow animation (repeats a few times)
  const pulsePacket = (packetId, edgeId, delay, color) => {
    tl.set(packetId, { top: 0, opacity: 0, scale: 0.5 }, delay);
    tl.to(packetId, { opacity: 1, scale: 1.5, duration: 0.2 }, delay);
    tl.to(packetId, { top: 200, duration: 1, ease: "power1.inOut" }, delay + 0.2);
    tl.to(packetId, { opacity: 0, scale: 0.5, duration: 0.2 }, delay + 1.1);
    // Node pulse effect
    const nextNode = packetId === '#p1' ? '#node2' : '#node3';
    tl.to(nextNode, { boxShadow: `0 0 60px ${color}`, duration: 0.3, yoyo: true, repeat: 1 }, delay + 1);
  };

  pulsePacket('#p1', '#edge1', 6.5, 'var(--c-cyan)');
  pulsePacket('#p2', '#edge2', 7.5, 'var(--c-purple)');
  
  pulsePacket('#p1', '#edge1', 9.5, 'var(--c-cyan)');
  pulsePacket('#p2', '#edge2', 10.5, 'var(--c-purple)');

  pulsePacket('#p1', '#edge1', 12.5, 'var(--c-cyan)');
  pulsePacket('#p2', '#edge2', 13.5, 'var(--c-purple)');

  // Captions
  const cap = document.getElementById('capText');
  tl.call(() => { cap.innerHTML = 'Hệ thống xử lý hoàn toàn <span class="hl">Local</span>'; }, [], 2);
  tl.call(() => { cap.innerHTML = 'Giảm chi phí cực đại cho <span class="hl">hệ thống</span>'; }, [], 8);
  tl.call(() => { cap.innerHTML = 'Bảo mật <span style="color:var(--c-green)">Tuyệt đối</span>'; }, [], 14);

  // Transition to Summary List
  tl.to('#diagramArea, .caption', { opacity: 0, y: -50, duration: 1.5, ease: "power2.inOut" }, 18);
  tl.to('.title-main', { textContent: 'LỢI ÍCH CỐT LÕI', duration: 0.5 }, 19);
  tl.to('.title-sub', { opacity: 0, duration: 0.5 }, 19);

  tl.set('#summaryArea', { opacity: 1 }, 19.5);
  tl.to('.s-item', { x: 0, opacity: 1, stagger: 1.5, duration: 1, ease: "power3.out" }, 20);

  // Final fade
  tl.to('body', { opacity: 0, duration: 2 }, 37);

  window.__timelines["codebase-memory-diagram"] = tl;
</script>
  <script src="../template_core.js"></script>
</body>
</html>
