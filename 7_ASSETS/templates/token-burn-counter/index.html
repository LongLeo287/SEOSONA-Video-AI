<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-core: #090B14;
  --bg-deep: #05060A;
  
  --c-cyan: #40E0D0;
  --c-yellow: #FFDF00;
  --c-magenta: #FF007A;
  --c-purple: #8A2BE2;
  --c-green: #00FF88;
  
  --text-main: #FFFFFF;
  --text-dim: #8C92A6;
  --text-label: #B0B8CC;
  
  --font: 'Be Vietnam Pro', sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px; height: 1920px; overflow: hidden;
  background: var(--bg-core); font-family: var(--font); color: var(--text-main);
}

/* Phase 1: The Burn */
.phase1 {
  position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  padding: 100px; z-index: 10;
}
.p1-title {
  font-size: 80px; font-weight: 900; color: var(--text-main); line-height: 1.1; margin-bottom: 40px;
}
.hl-burn { color: var(--c-magenta); text-shadow: 0 0 40px rgba(255,0,122,0.6); }

.counter-box { margin-top: 60px; }
.counter-num {
  font-size: 200px; font-weight: 900; color: var(--c-magenta); line-height: 1; letter-spacing: -4px;
}
.counter-sub {
  font-size: 24px; font-weight: 800; color: var(--text-dim); letter-spacing: 8px; margin-top: 10px;
}

/* Phase 2: The Solution (Graphify/Node Map) */
.phase2 {
  position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
  background: radial-gradient(circle at 50% 50%, rgba(64, 224, 208, 0.1) 0%, var(--bg-deep) 70%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 20; opacity: 0; pointer-events: none;
}
.p2-title {
  position: absolute; top: 200px; font-size: 64px; font-weight: 900; color: var(--c-cyan);
  letter-spacing: 10px; text-transform: uppercase;
}

/* Node Network */
.network { position: relative; width: 800px; height: 800px; }
.n-node {
  position: absolute; width: 30px; height: 30px; background: var(--c-cyan);
  border-radius: 50%; box-shadow: 0 0 30px var(--c-cyan); transform: translate(-50%, -50%);
}
.n-center { width: 60px; height: 60px; left: 50%; top: 50%; background: var(--text-main); box-shadow: 0 0 50px white; }
.n-label {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 700; color: var(--text-label); white-space: nowrap;
}

/* Big Savings Stats */
.savings {
  position: absolute; bottom: 200px; display: flex; gap: 100px; text-align: center;
}
.save-stat { font-size: 140px; font-weight: 900; color: var(--c-green); }
.save-desc { font-size: 32px; font-weight: 700; color: var(--text-main); }

</style>
</head>
<body data-composition-id="token-burn-counter" data-width="1080" data-height="1920" data-duration="45" data-fps="30">

<div class="phase1" id="phase1">
  <div class="p1-title" id="p1Title">
    Hệ thống cũ đang<br><span class="hl-burn">đốt tiền của bạn.</span>
  </div>
  <div class="counter-box" id="cBox">
    <div class="counter-num" id="counter">12,014</div>
    <div class="counter-sub">CHI PHÍ VÔ ÍCH MỖI THÁNG</div>
  </div>
</div>

<div class="phase2" id="phase2">
  <div class="p2-title">GIẢI PHÁP TỐI ƯU</div>
  
  <div class="network" id="network">
    <div class="n-node n-center"><div class="n-label">Tối Ưu Hóa</div></div>
    <!-- Satellite nodes generated by JS -->
  </div>

  <div class="savings">
    <div>
      <div class="save-stat">-70%</div>
      <div class="save-desc">CHI PHÍ VẬN HÀNH</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script>
  const DURATION = 45;
  window.__timelines = {};
  const tl = gsap.timeline({ paused: true });
  tl.totalDuration(DURATION);

  // Generate satellite nodes
  const network = document.getElementById('network');
  const numNodes = 8;
  const radius = 300;
  for(let i=0; i<numNodes; i++) {
    const angle = (i / numNodes) * Math.PI * 2;
    const x = 400 + Math.cos(angle) * radius;
    const y = 400 + Math.sin(angle) * radius;
    
    const node = document.createElement('div');
    node.className = 'n-node sat';
    node.style.left = x + 'px';
    node.style.top = y + 'px';
    
    // Line to center
    const line = document.createElement('div');
    line.style.position = 'absolute';
    line.style.background = 'rgba(64, 224, 208, 0.3)';
    line.style.height = '2px';
    line.style.width = radius + 'px';
    line.style.left = '400px';
    line.style.top = '400px';
    line.style.transformOrigin = '0 50%';
    line.style.transform = `rotate(${angle}rad)`;
    line.className = 'n-line';
    
    network.appendChild(line);
    network.appendChild(node);
  }

  // Phase 1: Rapid Counting
  const cObj = { val: 12014 };
  tl.from('#p1Title', { x: -100, opacity: 0, duration: 1, ease: "power3.out" }, 1);
  tl.from('#cBox', { y: 100, opacity: 0, duration: 1, ease: "power3.out" }, 1.5);
  
  tl.to(cObj, {
    val: 874953, duration: 6, ease: "power1.inOut",
    onUpdate: () => {
      document.getElementById('counter').innerText = Math.round(cObj.val).toLocaleString();
    }
  }, 2.5);

  // Flash warning
  tl.to('.phase1', { backgroundColor: 'rgba(255,0,122,0.1)', duration: 0.1, yoyo: true, repeat: 10 }, 7);

  // Phase Transition
  tl.to('#phase1', { x: -1080, opacity: 0, duration: 1.5, ease: "power3.inOut" }, 10);
  tl.set('#phase2', { opacity: 1 }, 10);
  tl.from('#phase2', { x: 1080, duration: 1.5, ease: "power3.inOut" }, 10);

  // Phase 2: Network Expansion
  tl.from('.p2-title', { scale: 0.5, opacity: 0, duration: 1.5, ease: "back.out(1.5)" }, 11.5);
  
  tl.from('.n-center', { scale: 0, opacity: 0, duration: 1, ease: "back.out(2)" }, 12);
  tl.from('.n-line', { scaleX: 0, opacity: 0, duration: 1, stagger: 0.1, ease: "power3.out" }, 12.5);
  tl.from('.sat', { scale: 0, opacity: 0, duration: 0.5, stagger: 0.1, ease: "back.out(2)" }, 13);
  
  // Rotating network
  tl.to('.network', { rotation: 90, duration: 20, ease: "none" }, 13);

  // Savings Stat
  tl.from('.savings', { y: 100, opacity: 0, duration: 1.5, ease: "power3.out" }, 15);
  
  // End fade
  tl.to('body', { opacity: 0, duration: 2 }, 40);

  window.__timelines["token-burn-counter"] = tl;
</script>
  <script src="../template_core.js"></script>
</body>
</html>
