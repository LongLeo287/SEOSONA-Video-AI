<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-core: #090B14;
  --bg-deep: #05060A;
  
  --c-cyan: #40E0D0;
  --c-yellow: #FFDF00;
  --c-magenta: #FF007A;
  --c-purple: #8A2BE2;
  --c-green: #00FF88;
  
  --text-main: #FFFFFF;
  --text-dim: #8C92A6;
  --text-label: #B0B8CC;
  
  --font: 'Be Vietnam Pro', sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px; height: 1920px; overflow: hidden;
  background: var(--bg-core); font-family: var(--font); color: var(--text-main);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}

/* Header */
.header { position: absolute; top: 150px; text-align: center; }
.title { font-size: 64px; font-weight: 900; }
.title .hl { color: var(--c-magenta); }

/* Visualization */
.viz-container { position: relative; width: 1000px; height: 1000px; }

/* The Manual State */
.manual-state {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.time-circle {
  width: 400px; height: 400px; border-radius: 50%;
  border: 10px solid var(--c-magenta); background: rgba(255,0,122,0.1);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 50px rgba(255,0,122,0.3);
}
.time-val { font-size: 150px; font-weight: 900; color: var(--c-magenta); letter-spacing: -5px; }
.time-unit { font-size: 50px; margin-left: 10px; }
.time-label { font-size: 32px; font-weight: 700; color: var(--text-label); margin-top: 30px; letter-spacing: 4px; text-transform: uppercase;}

/* The Auto State */
.auto-state {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 100%; height: 100%; opacity: 0; pointer-events: none;
}
.central-core {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 250px; height: 250px; border-radius: 50%; background: var(--c-cyan);
  box-shadow: 0 0 60px var(--c-cyan); display: flex; align-items: center; justify-content: center;
}
.core-text { font-size: 40px; font-weight: 900; color: var(--bg-core); text-align: center; line-height: 1.2; }

/* Captions */
.caption-box { position: absolute; bottom: 200px; text-align: center; width: 900px; }
.caption { font-size: 48px; font-weight: 700; line-height: 1.4; }
.caption .cyan { color: var(--c-cyan); }
.caption .yellow { color: var(--c-yellow); }

</style>
</head>
<body data-composition-id="workflow-automation-graph" data-width="1080" data-height="1920" data-duration="45" data-fps="30">

<div class="header" id="header">
  <div class="title">QUY TRÌNH <span class="hl" id="h-hl">THỦ CÔNG</span></div>
</div>

<div class="viz-container">
  <!-- Manual -->
  <div class="manual-state" id="manual">
    <div class="time-circle" id="timeCircle">
      <div class="time-val"><span id="t-num">5</span><span class="time-unit" id="t-unit">h</span></div>
    </div>
    <div class="time-label" id="t-label">LÀM VIỆC MỖI TUẦN</div>
  </div>

  <!-- Auto -->
  <div class="auto-state" id="auto">
    <!-- Nodes will be added here via JS -->
    <div class="central-core" id="core">
      <div class="core-text">HỆ THỐNG<br>TỰ ĐỘNG</div>
    </div>
  </div>
</div>

<div class="caption-box">
  <div class="caption" id="capText">Bạn đang lãng phí hàng giờ đồng hồ...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script>
  const DURATION = 45;
  window.__timelines = {};
  const tl = gsap.timeline({ paused: true });
  tl.totalDuration(DURATION);

  // Generate nodes for auto state
  const autoState = document.getElementById('auto');
  const numNodes = 12;
  const radius = 350;
  for(let i=0; i<numNodes; i++) {
    const angle = (i / numNodes) * Math.PI * 2;
    const x = 500 + Math.cos(angle) * radius;
    const y = 500 + Math.sin(angle) * radius;
    
    const node = document.createElement('div');
    node.style.position = 'absolute';
    node.style.width = '40px';
    node.style.height = '40px';
    node.style.background = i % 2 === 0 ? 'var(--c-yellow)' : 'var(--c-cyan)';
    node.style.borderRadius = '50%';
    node.style.left = x + 'px';
    node.style.top = y + 'px';
    node.style.transform = 'translate(-50%, -50%)';
    node.className = 'a-node';
    
    const line = document.createElement('div');
    line.style.position = 'absolute';
    line.style.height = '2px';
    line.style.background = 'rgba(255,255,255,0.2)';
    line.style.width = radius + 'px';
    line.style.left = '500px';
    line.style.top = '500px';
    line.style.transformOrigin = '0 50%';
    line.style.transform = `rotate(${angle}rad)`;
    line.className = 'a-line';
    
    autoState.appendChild(line);
    autoState.appendChild(node);
  }

  // Animation Sequence
  
  // 1. Manual State
  tl.from('#header', { y: -50, opacity: 0, duration: 1, ease: "power2.out" }, 1);
  tl.from('#manual', { scale: 0.8, opacity: 0, duration: 1, ease: "back.out(1.5)" }, 1.5);
  
  // Throbbing effect
  tl.to('#timeCircle', { scale: 1.05, duration: 0.5, yoyo: true, repeat: 5 }, 2.5);

  // 2. The Drop (5h -> 5m)
  const tNum = document.getElementById('t-num');
  const tUnit = document.getElementById('t-unit');
  
  tl.call(() => { document.getElementById('capText').innerHTML = 'Giờ đây có thể xử lý trong nháy mắt.'; }, [], 6);
  
  tl.to(tNum, {
    innerHTML: 5, duration: 2, ease: "none",
    onUpdate: function() { tNum.innerHTML = Math.max(5, Math.floor(60 - this.progress() * 55)); }
  }, 7);
  
  tl.call(() => { tUnit.innerHTML = 'm'; tNum.innerHTML = '5'; }, [], 9);
  tl.to('#timeCircle', { borderColor: 'var(--c-cyan)', backgroundColor: 'rgba(64,224,208,0.1)', boxShadow: '0 0 50px rgba(64,224,208,0.5)', duration: 0.5 }, 9);
  tl.to('.time-val', { color: 'var(--c-cyan)', duration: 0.5 }, 9);
  tl.to('#t-label', { textContent: 'LÀM VIỆC MỖI TUẦN', duration: 0.1 }, 9);
  tl.to('#h-hl', { textContent: 'TỐI ƯU', color: 'var(--c-cyan)', duration: 0.5 }, 9);

  // 3. Explosion into Automation Graph
  tl.to('#manual', { scale: 0, opacity: 0, duration: 1, ease: "back.in(2)" }, 12);
  
  tl.set('#auto', { opacity: 1 }, 13);
  tl.from('#core', { scale: 0, duration: 1, ease: "back.out(2)" }, 13);
  tl.from('.a-line', { scaleX: 0, duration: 0.8, stagger: 0.05, ease: "power2.out" }, 13.5);
  tl.from('.a-node', { scale: 0, duration: 0.8, stagger: 0.05, ease: "back.out(2)" }, 13.8);
  
  // Rotation
  tl.to('#auto', { rotation: 90, duration: 15, ease: "none" }, 14);

  tl.call(() => { document.getElementById('capText').innerHTML = 'Tự động trích xuất thành <span class="cyan">Knowledge Graph</span>'; }, [], 14);
  tl.call(() => { document.getElementById('capText').innerHTML = 'Tăng tốc <span class="yellow">hiệu suất</span> làm việc tối đa'; }, [], 20);

  // End fade
  tl.to('body', { opacity: 0, duration: 2 }, 40);

  window.__timelines["workflow-automation-graph"] = tl;
</script>
  <script src="../template_core.js"></script>
</body>
</html>
