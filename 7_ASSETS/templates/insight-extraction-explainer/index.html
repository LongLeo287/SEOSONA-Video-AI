<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-core: #090B14;
  --bg-deep: #05060A;
  
  --c-cyan: #40E0D0;
  --c-yellow: #FFDF00;
  --c-magenta: #FF007A;
  --c-purple: #8A2BE2;
  --c-green: #00FF88;
  
  --text-main: #FFFFFF;
  --text-dim: #8C92A6;
  --text-label: #B0B8CC;
  
  --font: 'Be Vietnam Pro', sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px; height: 1920px; overflow: hidden;
  background: var(--bg-deep); font-family: var(--font); color: var(--text-main);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}

/* Header */
.header { position: absolute; top: 120px; left: 80px; }
.title { font-size: 64px; font-weight: 900; line-height: 1.2; }
.title .hl { color: var(--c-cyan); }

/* Layout */
.container {
  display: flex; flex-direction: column; gap: 60px;
  width: 920px; height: 1300px; position: relative;
}

/* Video Placeholder */
.vid-ph {
  width: 100%; height: 500px; background: var(--bg-core); border: 2px solid rgba(255,255,255,0.1);
  border-radius: 24px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.vid-icon { font-size: 64px; color: var(--text-dim); }
.scanner {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(to bottom, transparent 0%, rgba(64,224,208,0.2) 50%, var(--c-cyan) 100%);
  border-bottom: 2px solid var(--c-cyan);
  transform: translateY(-100%); opacity: 0;
}

/* Extraction UI */
.ext-box {
  flex: 1; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
  border-radius: 24px; padding: 50px; display: flex; flex-direction: column; gap: 30px;
}
.ext-title { font-size: 32px; font-weight: 800; color: var(--c-magenta); letter-spacing: 2px; text-transform: uppercase; }

.point { display: flex; gap: 20px; opacity: 0; transform: translateY(20px); }
.p-dot { width: 16px; height: 16px; background: var(--c-cyan); border-radius: 50%; margin-top: 12px; box-shadow: 0 0 10px var(--c-cyan); }
.p-text { font-size: 28px; line-height: 1.5; color: var(--text-main); flex: 1; }

</style>
</head>
<body data-composition-id="insight-extraction-explainer" data-width="1080" data-height="1920" data-duration="45" data-fps="30">

<div class="header">
  <div class="title">Bóc tách dữ liệu<br><span class="hl">siêu tốc</span> với AI</div>
</div>

<div class="container">
  <!-- Video analysis sim -->
  <div class="vid-ph">
    <div class="vid-icon">▶ SOURCE MEDIA</div>
    <div class="scanner" id="scanner"></div>
  </div>

  <!-- Output block -->
  <div class="ext-box">
    <div class="ext-title">INSIGHTS TRÍCH XUẤT:</div>
    <div class="point" id="pt1">
      <div class="p-dot"></div>
      <div class="p-text">Phát hiện 3 xu hướng chính đang thịnh hành trong video.</div>
    </div>
    <div class="point" id="pt2">
      <div class="p-dot" style="background:var(--c-yellow); box-shadow: 0 0 10px var(--c-yellow);"></div>
      <div class="p-text">Tự động phân loại sắc thái cảm xúc của người xem: Tích cực (85%).</div>
    </div>
    <div class="point" id="pt3">
      <div class="p-dot" style="background:var(--c-magenta); box-shadow: 0 0 10px var(--c-magenta);"></div>
      <div class="p-text">Nhận diện chính xác 5 thương hiệu được đề cập.</div>
    </div>
    <div class="point" id="pt4">
      <div class="p-dot"></div>
      <div class="p-text">Tạo kịch bản tóm tắt tự động chỉ trong 2.4 giây.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script>
  const DURATION = 45;
  window.__timelines = {};
  const tl = gsap.timeline({ paused: true });
  tl.totalDuration(DURATION);

  tl.from('.header', { y: -50, opacity: 0, duration: 1, ease: "power2.out" }, 1);
  tl.from('.container', { y: 100, opacity: 0, duration: 1, ease: "power3.out" }, 1.5);

  // Scanner animation
  tl.set('#scanner', { opacity: 1 }, 2);
  tl.to('#scanner', { y: '100%', duration: 2, ease: "none", repeat: 5 }, 2);

  // Points appear sync'd with scans
  tl.to('#pt1', { y: 0, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 3);
  tl.to('#pt2', { y: 0, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 5);
  tl.to('#pt3', { y: 0, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 7);
  tl.to('#pt4', { y: 0, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 9);

  // Scanner fade out
  tl.to('#scanner', { opacity: 0, duration: 1 }, 13);
  
  // Highlight box glow
  tl.to('.ext-box', { borderColor: 'rgba(64,224,208,0.3)', boxShadow: '0 0 50px rgba(64,224,208,0.1)', duration: 1 }, 13);

  // End fade
  tl.to('body', { opacity: 0, duration: 2 }, 40);

  window.__timelines["insight-extraction-explainer"] = tl;
</script>
  <script src="../template_core.js"></script>
</body>
</html>
